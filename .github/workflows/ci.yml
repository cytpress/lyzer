name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @lyzer/api build

      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          GEMINI_MODEL_NAME: gemini-3-flash-preview
          CLOUDFLARE_DEPLOY_HOOK_URL: https://example.invalid/deploy
          TUNNEL_TOKEN: ci-placeholder
          LYZER_JOB_TOKEN: ci-placeholder
        run: docker compose config --quiet
