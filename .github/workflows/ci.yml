name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main-branch run while it may be deploying production.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @lyzer/api build

      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          GEMINI_MODEL_NAME: gemini-3-flash-preview
          CLOUDFLARE_DEPLOY_HOOK_URL: https://example.invalid/deploy
          TUNNEL_TOKEN: ci-placeholder
          LYZER_JOB_TOKEN: ci-placeholder
        run: docker compose config --quiet

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE" "$SHA")"
          fi

          backend_changed=false
          while IFS= read -r path; do
            case "$path" in
              .dockerignore|docker-compose.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json|packages/api/*|packages/web/package.json|ops/scheduler/*|scripts/lyzer-*.sh)
                backend_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "backend=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "Backend changes detected: $backend_changed"

      - name: Check deployment settings
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          HEADSCALE_PREAUTH_KEY: ${{ secrets.HEADSCALE_PREAUTH_KEY }}
          DOCKHAND_WEBHOOK_URL: ${{ vars.DOCKHAND_WEBHOOK_URL }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          set -eu
          missing=false
          if [[ "$BACKEND_CHANGED" == true ]]; then
            if [[ -z "$HEADSCALE_PREAUTH_KEY" ]]; then
              echo "::error::Missing GitHub Actions secret: HEADSCALE_PREAUTH_KEY"
              missing=true
            fi
            if [[ -z "$DOCKHAND_WEBHOOK_URL" ]]; then
              echo "::error::Missing GitHub Actions variable: DOCKHAND_WEBHOOK_URL"
              missing=true
            fi
            if [[ -z "$DOCKHAND_WEBHOOK_SECRET" ]]; then
              echo "::error::Missing GitHub Actions secret: DOCKHAND_WEBHOOK_SECRET"
              missing=true
            fi
          fi
          if [[ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_DEPLOY_HOOK_URL"
            missing=true
          fi
          [[ "$missing" == false ]]

      - name: Connect to Headscale
        if: steps.changes.outputs.backend == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.HEADSCALE_PREAUTH_KEY }}
          args: --login-server=https://hs.lyzer.tw
          ping: 100.64.0.1

      - name: Deploy Dockhand Git Stack via webhook
        if: steps.changes.outputs.backend == 'true'
        env:
          DOCKHAND_WEBHOOK_URL: ${{ vars.DOCKHAND_WEBHOOK_URL }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          set -eu
          payload='{}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DOCKHAND_WEBHOOK_SECRET" | awk '{print $NF}')"
          webhook_result="$(curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 1500 --request POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload" \
            "$DOCKHAND_WEBHOOK_URL")"
          if ! jq -e '.success == true' <<< "$webhook_result" >/dev/null; then
            echo "::error::Dockhand webhook did not report success."
            jq -r '.error? // empty' <<< "$webhook_result"
            exit 1
          fi
          if jq -e '.skipped == true' <<< "$webhook_result" >/dev/null; then
            echo "Dockhand webhook succeeded; deployment was skipped because the stack has no new changes."
          else
            echo "Dockhand Git Stack webhook completed successfully."
          fi

      - name: Trigger Cloudflare Pages
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 60 --request POST \
            "$CLOUDFLARE_DEPLOY_HOOK_URL"
          echo "Cloudflare Pages deployment triggered."

  verify-headscale-webhook:
    name: Verify Headscale Dockhand webhook
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/tailscale-dockhand-deploy' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Connect to Headscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.HEADSCALE_PREAUTH_KEY }}
          args: --login-server=https://hs.lyzer.tw
          ping: 100.64.0.1

      - name: Send signed Dockhand webhook
        env:
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          set -eu
          payload='{}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DOCKHAND_WEBHOOK_SECRET" | awk '{print $NF}')"
          webhook_result="$(curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 1500 --request POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload" \
            http://100.64.0.1:3000/api/git/stacks/7/webhook)"
          if ! jq -e '.success == true' <<< "$webhook_result" >/dev/null; then
            echo "::error::Dockhand webhook did not report success."
            jq -r '.error? // empty' <<< "$webhook_result"
            exit 1
          fi
          if jq -e '.skipped == true' <<< "$webhook_result" >/dev/null; then
            echo "Dockhand accepted the signed webhook; no stack changes needed deployment."
          else
            echo "Dockhand accepted the signed webhook and completed stack reconciliation."
          fi
