name: lyzer

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lyzer_db}
      POSTGRES_USER: ${POSTGRES_USER:-lyzer_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # PostgreSQL is reachable only through this host's Tailscale interface.
      - "100.64.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lyzer_admin} -d $${POSTGRES_DB:-lyzer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lyzer_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lyzer_db}
      SSG_API_BASE: http://127.0.0.1:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME}
      CLOUDFLARE_DEPLOY_HOOK_URL: ${CLOUDFLARE_DEPLOY_HOOK_URL}
      LYZER_JOB_TOKEN: ${LYZER_JOB_TOKEN}
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: ops/scheduler/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      API_BASE: http://api:3000
      FETCH_PAGES: ${FETCH_PAGES:-3}
      ANALYZE_LIMIT: ${ANALYZE_LIMIT:-1}
      LYZER_JOB_TOKEN: ${LYZER_JOB_TOKEN}
    depends_on:
      api:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
